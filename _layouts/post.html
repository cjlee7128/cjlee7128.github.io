---
layout: custom
---

<div class="post-detail-wrapper">
    <div class="post-back-nav">
        <a href="{{ '/blog/' | relative_url }}" class="back-link">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
            </svg>
            Back to Research Blog
        </a>
    </div>

    <article class="post-article">
        <header class="post-header">
            <div class="post-meta">
                <span class="post-date">{{ page.date | date: "%B %d, %Y" }}</span>
                <span class="post-category category-{{ page.category | downcase }}">{{ page.category }}</span>
            </div>
            <h1 class="post-title">{{ page.title }}</h1>
        </header>

        <div class="post-body">
            {{ content }}
        </div>
    </article>

    <!-- Post Navigation (Next / Prev) -->
    <nav class="post-pagination">
        {% if page.previous %}
        <a class="prev-post" href="{{ page.previous.url | relative_url }}">
            <span class="nav-label">← Previous Post</span>
            <span class="nav-title">{{ page.previous.title }}</span>
        </a>
        {% else %}
        <div class="prev-post disabled"></div>
        {% endif %}

        {% if page.next %}
        <a class="next-post" href="{{ page.next.url | relative_url }}">
            <span class="nav-label">Next Post →</span>
            <span class="nav-title">{{ page.next.title }}</span>
        </a>
        {% else %}
        <div class="next-post disabled"></div>
        {% endif %}
    </nav>
</div>
